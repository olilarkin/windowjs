name: macOS build (2025)

on:
  push:
    branches: [ main, 'claude/**' ]
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - 'types/**'
      - '**.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - 'types/**'
      - '**.md'
  release:
    types: [published]

  # Allows running this workflow manually from the Actions tab.
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packages
        run: |
          brew install ninja gn upx

      - name: Cache libraries
        id: cache-libraries
        uses: actions/cache@v4
        with:
          path: |
            libraries/angle/include
            libraries/angle/out
            libraries/depot_tools
            libraries/gn
            libraries/glfw
            libraries/ninja
            libraries/skia/include
            libraries/skia/modules
            libraries/skia/out
            libraries/v8/include
            libraries/v8/src
            libraries/v8/third_party/zlib
            libraries/v8/out
            libraries/libuv
          key: macos-2025-v1-${{ hashFiles('.gclient', 'libraries/*-args-mac.gn', 'libraries/build_*.sh') }}

      - name: Setup build environment
        run: |
          source libraries/setup_build_env.sh
          echo "$PWD/libraries/depot_tools" >> $GITHUB_PATH
          echo "$PWD/libraries/gn/out" >> $GITHUB_PATH
          echo "$PWD/libraries/ninja" >> $GITHUB_PATH

      - name: Sync dependencies
        if: steps.cache-libraries.outputs.cache-hit != 'true'
        run: |
          source libraries/setup_build_env.sh
          libraries/sync.sh

      - name: Build V8
        if: steps.cache-libraries.outputs.cache-hit != 'true'
        run: |
          source libraries/setup_build_env.sh
          libraries/build_v8.sh

      - name: Build Skia
        if: steps.cache-libraries.outputs.cache-hit != 'true'
        run: |
          source libraries/setup_build_env.sh
          libraries/build_skia.sh

      - name: Build ANGLE
        if: steps.cache-libraries.outputs.cache-hit != 'true'
        run: |
          source libraries/setup_build_env.sh
          libraries/build_angle.sh

      - name: Build Window.js (Release)
        run: |
          source libraries/setup_build_env.sh
          cmake -S . -B out/Release -DCMAKE_BUILD_TYPE=Release -G Ninja
          cmake --build out/Release --target windowjs --target windowjs-p5

      - name: Build Window.js (Debug)
        run: |
          source libraries/setup_build_env.sh
          cmake -S . -B out/Debug -DCMAKE_BUILD_TYPE=Debug -G Ninja
          cmake --build out/Debug --target windowjs --target windowjs-p5

# Tests are disabled in the macOS workflow because GLFW fails to initialize in CI:
# https://github.com/windowjs/windowjs/issues/64
#
#      - name: Run tests
#        run: |
#          # Run tests in Debug for more assertions
#          export DYLD_LIBRARY_PATH="$PWD/libraries/v8/out/Release:$PWD/libraries/skia/out/Release:$PWD/libraries/angle/out/Release:$DYLD_LIBRARY_PATH"
#          out/Debug/windowjs tests/run_tests.js

      - name: Bundle for distribution
        run: |
          chmod +x scripts/bundle_macos.sh
          ./scripts/bundle_macos.sh Release

      - name: Binary size
        run: |
          echo "=== Release build sizes ==="
          du -h out/Release/windowjs
          du -h out/Release/WindowJS.app/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windowjs-macos-arm64
          path: out/Release/WindowJS.app/
