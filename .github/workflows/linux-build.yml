name: Linux build (2025)

on:
  push:
    branches: [ main, 'claude/**' ]
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - 'types/**'
      - '**.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - 'types/**'
      - '**.md'
  release:
    types: [published]

  # Allows running this workflow manually from the Actions tab.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            clang \
            ninja-build \
            libfontconfig-dev \
            libjpeg-turbo8-dev \
            libwebp-dev \
            libgl-dev \
            libglx-dev \
            libxrandr-dev \
            xorg-dev \
            libxcb1-dev \
            libx11-dev \
            libxext-dev \
            upx \
            xvfb \
            re2c

      - name: Cache libraries
        id: cache-libraries
        uses: actions/cache@v4
        with:
          path: |
            libraries/angle/include
            libraries/angle/out
            libraries/depot_tools
            libraries/gn_bin
            libraries/glfw
            libraries/skia/include
            libraries/skia/modules
            libraries/skia/out
            libraries/v8/include
            libraries/v8/src
            libraries/v8/third_party/zlib
            libraries/v8/out
            libraries/libuv
          key: linux-2025-v3-${{ hashFiles('.gclient', 'libraries/*-args-linux.gn', 'libraries/build_*.sh') }}

      - name: Setup build environment
        run: |
          source libraries/setup_build_env.sh
          echo "$PWD/libraries/gn_bin" >> $GITHUB_PATH
          echo "$PWD/libraries/depot_tools" >> $GITHUB_PATH

      - name: Sync dependencies
        if: steps.cache-libraries.outputs.cache-hit != 'true'
        run: |
          source libraries/setup_build_env.sh
          libraries/sync.sh

      - name: Build V8
        if: steps.cache-libraries.outputs.cache-hit != 'true'
        run: |
          source libraries/setup_build_env.sh
          libraries/build_v8.sh

      - name: Build Skia
        if: steps.cache-libraries.outputs.cache-hit != 'true'
        run: |
          source libraries/setup_build_env.sh
          libraries/build_skia.sh

      - name: Build ANGLE
        if: steps.cache-libraries.outputs.cache-hit != 'true'
        run: |
          source libraries/setup_build_env.sh
          libraries/build_angle.sh

      - name: Build Window.js (Release)
        run: |
          source libraries/setup_build_env.sh
          cmake -S . -B out/Release -DCMAKE_BUILD_TYPE=Release -G Ninja
          cmake --build out/Release --target windowjs --target windowjs-p5

      - name: Build Window.js (Debug)
        run: |
          source libraries/setup_build_env.sh
          cmake -S . -B out/Debug -DCMAKE_BUILD_TYPE=Debug -G Ninja
          cmake --build out/Debug --target windowjs --target windowjs-p5

      - name: Run tests
        run: |
          # Run tests in Debug for more assertions
          export LIBGL_ALWAYS_SOFTWARE=true
          export GALLIUM_DRIVER=llvmpipe
          # Set library path for dynamic linking
          export LD_LIBRARY_PATH="$PWD/libraries/v8/out/Release:$PWD/libraries/skia/out/Release:$PWD/libraries/angle/out/Release:$LD_LIBRARY_PATH"
          xvfb-run -a out/Debug/windowjs tests/run_tests.js

      - name: Bundle for distribution
        run: |
          chmod +x scripts/bundle_linux.sh
          ./scripts/bundle_linux.sh Release

      - name: Binary size
        run: |
          echo "=== Release build sizes ==="
          du -h out/Release/windowjs
          du -h out/Release/windowjs-linux-x64/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windowjs-linux-x64
          path: out/Release/windowjs-linux-x64/
