name: Windows build (2025)

on:
  push:
    branches: [ main, 'claude/**' ]
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - 'types/**'
      - '**.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - 'types/**'
      - '**.md'
  release:
    types: [published]

  # Allows running this workflow manually from the Actions tab.
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Prevent newline conversions on Windows checkouts.
      - name: Git config
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packages
        run: choco install upx ninja

      - name: Cache libraries
        id: cache-libraries
        uses: actions/cache@v4
        with:
          path: |
            libraries/angle/include
            libraries/angle/out
            libraries/depot_tools
            libraries/gn
            libraries/glfw
            libraries/ninja
            libraries/skia/include
            libraries/skia/modules
            libraries/skia/out
            libraries/v8/include
            libraries/v8/src
            libraries/v8/third_party/zlib
            libraries/v8/out
            libraries/libuv
          key: windows-2025-v1-${{ hashFiles('.gclient', 'libraries/*-args-windows.gn', 'libraries/build_*.bat') }}

      - name: Setup build environment
        run: |
          libraries/setup_build_env.ps1
          echo "$env:GITHUB_WORKSPACE/libraries/depot_tools" >> $env:GITHUB_PATH
          echo "$env:GITHUB_WORKSPACE/libraries/gn/out" >> $env:GITHUB_PATH
          echo "$env:GITHUB_WORKSPACE/libraries/ninja" >> $env:GITHUB_PATH

      - name: Sync dependencies
        if: steps.cache-libraries.outputs.cache-hit != 'true'
        run: |
          libraries/setup_build_env.ps1
          libraries/sync.ps1

      - name: Build V8
        if: steps.cache-libraries.outputs.cache-hit != 'true'
        run: |
          libraries/setup_build_env.ps1
          libraries/build_v8.bat

      - name: Build Skia
        if: steps.cache-libraries.outputs.cache-hit != 'true'
        run: |
          libraries/setup_build_env.ps1
          libraries/build_skia.bat

      - name: Build ANGLE
        if: steps.cache-libraries.outputs.cache-hit != 'true'
        run: |
          libraries/setup_build_env.ps1
          libraries/build_angle.bat

      - name: Build Window.js (Release)
        run: |
          libraries/setup_build_env.ps1
          cmake -S . -B out/Release -DCMAKE_BUILD_TYPE=Release -G Ninja
          cmake --build out/Release --target windowjs --target windowjs-p5

      - name: Build Window.js (Debug)
        run: |
          libraries/setup_build_env.ps1
          cmake -S . -B out/Debug -DCMAKE_BUILD_TYPE=Debug -G Ninja
          cmake --build out/Debug --target windowjs --target windowjs-p5

      - name: Run tests
        run: |
          # Run tests in Debug for more assertions
          # Note: run tests in Debug on Windows because Release builds
          # don't have a console, and so their exit code is always 0;
          # that would prevent test failures from making the workflow fail.
          $env:PATH = "$env:GITHUB_WORKSPACE/libraries/v8/out/Release;$env:GITHUB_WORKSPACE/libraries/skia/out/Release;$env:GITHUB_WORKSPACE/libraries/angle/out/Release;$env:PATH"
          out/Debug/windowjs.exe tests/run_tests.js

      - name: Bundle for distribution
        run: |
          .\scripts\bundle_windows.bat Release

      - name: Binary size
        run: |
          Write-Host "=== Release build sizes ==="
          Get-ChildItem out/Release/windowjs.exe | Select-Object Length
          Get-ChildItem out/Release/windowjs-win-x64/ -Recurse | Measure-Object -Property Length -Sum

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windowjs-win-x64
          path: out/Release/windowjs-win-x64/
