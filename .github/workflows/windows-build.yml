name: Windows build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - 'examples/**'
      - 'types/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - 'examples/**'
      - 'types/**'
  release:
    types: [published]

  # Allows running this workflow manually from the Actions tab.
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Prevent newline conversions on Windows checkouts.
      - name: Git config
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packages
        run: |
          choco install upx ninja -y
          # Download gn from official Google Cloud Storage
          Invoke-WebRequest -Uri "https://chrome-infra-packages.appspot.com/dl/gn/gn/windows-amd64/+/latest" -OutFile gn.zip
          Expand-Archive gn.zip -DestinationPath C:\gn
          # Add to PATH for subsequent steps
          "C:\gn" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # List installed SDKs for debugging
          Write-Host "Installed Windows SDKs:"
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -Directory | Select-Object Name

      - name: Cache
        id: cache-libraries
        uses: actions/cache@v4
        with:
          path: |
            libraries/angle/include
            libraries/angle/out/Release/obj/libEGL_static.lib
            libraries/depot_tools
            libraries/gn
            libraries/glfw
            libraries/ninja
            libraries/skia/include
            libraries/skia/modules
            libraries/skia/out/Release/skia.lib
            libraries/v8/include
            libraries/v8/src
            libraries/v8/third_party/zlib
            libraries/v8/out/Release/obj/v8_monolith.lib
            libraries/libuv
          key: ${{ runner.os }}-build-cache-v3-${{ hashFiles('.gclient', 'libraries/build_skia.bat', 'libraries/skia-args-windows.gn', 'libraries/skia.patch', 'libraries/build_v8.bat', 'libraries/v8-args-windows.gn', 'libraries/v8.patch', 'libraries/glfw.patch', 'libraries/build_angle.bat', 'libraries/angle-args-windows.gn', 'libraries/angle.patch') }}

      - name: Sync
        if: steps.cache-libraries.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = "Stop"
          .\libraries\setup_build_env.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\libraries\sync.ps1

      - name: Build Skia
        if: steps.cache-libraries.outputs.cache-hit != 'true'
        run: |
          .\libraries\setup_build_env.ps1
          .\libraries\build_skia.bat

      - name: Build ANGLE
        if: steps.cache-libraries.outputs.cache-hit != 'true'
        run: |
          .\libraries\setup_build_env.ps1
          .\libraries\build_angle.bat

      - name: Build v8
        if: steps.cache-libraries.outputs.cache-hit != 'true'
        run: |
          .\libraries\setup_build_env.ps1
          .\libraries\build_v8.bat

      - name: Release build
        run: |
          .\libraries\setup_build_env.ps1
          # Note: not passing LLVM_DIR; this config builds with MSVC.
          cmake -S. -B out -DCMAKE_BUILD_TYPE=Release -G Ninja
          cmake --build out -t windowjs -t windowjs-p5

      - name: Debug build
        run: |
          .\libraries\setup_build_env.ps1
          # Note: not passing LLVM_DIR; this config builds with MSVC.
          cmake -S. -B out-debug -DCMAKE_BUILD_TYPE=Debug -G Ninja
          cmake --build out-debug -t windowjs -t windowjs-p5

      - name: Tests
        run: |
          # Note: run tests in Debug to have more assertions.
          # Note: run tests in Debug on Windows because Release builds
          # don't have a console, and so their exit code is always 0;
          # that would prevent test failures from making the workflow fail.
          out-debug/windowjs.exe tests/run_tests.js

      - name: Binary size
        run: |
          Write-Host "Size after build:"
          Write-Host((Get-Item out/windowjs.exe).length)
          upx -9 out/windowjs.exe
          upx -9 out/windowjs-p5.exe
          Write-Host "Size after upx:"
          Write-Host((Get-Item out/windowjs.exe).length)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windowjs.exe
          path: |
            out/windowjs.exe
            out/windowjs-p5.exe
